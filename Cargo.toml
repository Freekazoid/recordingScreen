[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/diarize",
    "crates/ml",
    "crates/ml-worker",
    "crates/nemo",
    "crates/ui",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Freekazoid"]

[workspace.dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["screencast", "screenshot", "async-io"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
dirs = "6"
eframe = "0.37"
egui = "0.37"
hound = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.9"
sha2 = "0.11"
sherpa-onnx-sys = "2.0.1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
ureq = "2.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
whisper-rs = "0.16"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
