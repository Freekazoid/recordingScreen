[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/ml",
    "crates/ml-worker",
    "crates/ui",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Freekazoid"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
dirs = "6"
eframe = "0.37"
egui = "0.37"
libc = "0.2"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "2.12"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
