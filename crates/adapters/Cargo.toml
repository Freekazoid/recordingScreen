[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
ashpd.workspace = true
libc.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
