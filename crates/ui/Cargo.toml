[package]
name = "screenrecorder-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
screenrecorder-adapters = { path = "../adapters" }
screenrecorder-application = { path = "../application" }
screenrecorder-domain = { path = "../domain" }

chrono.workspace = true
futures-lite.workspace = true
eframe.workspace = true
egui_extras = { version = "0.37", features = ["image"] }
global-hotkey.workspace = true
image.workspace = true
tray-icon.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
winit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
ashpd.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
